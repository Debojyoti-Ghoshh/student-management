<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <h1>Student Management System</h1>

        <nav>

            <button onclick="showSection('dashboard')">
                Dashboard
            </button>

            <button onclick="showSection('students')">
                Students
            </button>

            <button onclick="showSection('calculator')">
                Calculator
            </button>

        </nav>

    </header>


    <!-- ================= DASHBOARD ================= -->

    <section id="dashboard"
             class="section active">

        <div class="dashboard">

            <h2>Dashboard</h2>

            <div class="card">

                <h3>Total Students</h3>

                <p id="studentCount">0</p>

            </div>

        </div>

    </section>


    <!-- ================= STUDENT MANAGEMENT ================= -->

    <section id="students"
             class="section">

        <h2>Student Management</h2>


        <!-- Student Form -->

        <div class="form-container">

            <input
                type="hidden"
                id="studentId">


            <input
                type="text"
                id="name"
                placeholder="Student Name">


            <input
                type="text"
                id="rollNo"
                placeholder="Roll Number">


            <input
                type="text"
                id="department"
                placeholder="Department">


            <input
                type="number"
                id="semester"
                placeholder="Semester">


            <input
                type="number"
                id="marks"
                placeholder="Marks">


            <button onclick="saveStudent()">
                Save Student
            </button>


            <button onclick="clearForm()">
                Clear
            </button>

        </div>


        <!-- Search -->

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Search student by name">
        
            <button onclick="searchStudents()">
                Search
            </button>
        
            <button onclick="loadStudents()">
                Show All
            </button>
        
        </div>
        
        
        <!-- Sorting -->
        
        <div class="sorting">
        
            <label for="sortStudents">
                Sort Students:
            </label>
        
            <select id="sortStudents"
                    onchange="sortStudents()">
        
                <option value="default">
                    Default
                </option>
        
                <option value="idAsc">
                    ID: Low to High
                </option>
        
                <option value="idDesc">
                    ID: High to Low
                </option>
        
                <option value="nameAsc">
                    Name: A to Z
                </option>
        
                <option value="nameDesc">
                    Name: Z to A
                </option>
        
            </select>
        
        </div>

        <!-- Student Table -->

        <table>

            <thead>

                <tr>

                    <th>S.No.</th>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Roll No</th>

                    <th>Department</th>

                    <th>Semester</th>

                    <th>Marks</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="studentTable">

            </tbody>

        </table>

    </section>


    <!-- ================= CALCULATOR ================= -->

    <section id="calculator"
             class="section">

        <h2>Calculator</h2>


        <div class="calculator">

            <input
                type="number"
                id="num1"
                placeholder="First number">


            <select id="operation">

                <option value="add">
                    +
                </option>

                <option value="subtract">
                    −
                </option>

                <option value="multiply">
                    ×
                </option>

                <option value="divide">
                    ÷
                </option>

                <option value="modulus">
                    %
                </option>

            </select>


            <input
                type="number"
                id="num2"
                placeholder="Second number">


            <button onclick="calculate()">
                Calculate
            </button>


            <h3 id="calcResult">
                Result: -
            </h3>

        </div>

    </section>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
